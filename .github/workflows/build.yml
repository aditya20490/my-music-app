name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repo code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the app project
        run: |
          npx create-expo-app@latest musicapp --template blank
          cd musicapp
          rm -f App.tsx App.js
          cp ../App.js App.js
          npx expo install expo-audio

      - name: Set app name and package
        run: |
          cd musicapp
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          cfg.expo.name = 'My Music';
          cfg.expo.slug = 'my-music';
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.package = 'com.mymusic.player';
          fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Generate Android project
        run: |
          cd musicapp
          npx expo prebuild --platform android

      - name: Build APK
        run: |
          cd musicapp/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: musicapp/android/app/build/outputs/apk/release/app-release.apk
