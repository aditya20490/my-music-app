name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repo code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Speed up builds with cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create the app project
        run: |
          npx create-expo-app@latest musicapp --template blank
          cd musicapp
          rm -f App.tsx App.js
          cp ../App.js App.js
          npx expo install expo-audio expo-media-library expo-linear-gradient react-native-safe-area-context @expo/vector-icons expo-font
          npx expo install --fix
          npm install @missingcore/react-native-metadata-retriever@^3.2.1 || echo "Song details library failed to install, continuing without it"

      - name: Set app name, package and permissions
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd musicapp
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const run = parseInt(process.env.RUN_NUMBER, 10);
          cfg.expo.name = 'My Music';
          cfg.expo.slug = 'my-music';
          cfg.expo.version = '1.0.' + run;
          cfg.expo.userInterfaceStyle = 'dark';
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.package = 'com.mymusic.player';
          cfg.expo.android.versionCode = run;
          cfg.expo.android.permissions = [
            'android.permission.READ_MEDIA_AUDIO',
            'android.permission.READ_EXTERNAL_STORAGE',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
            'android.permission.WAKE_LOCK'
          ];
          cfg.expo.plugins = ['expo-audio', 'expo-media-library'];
          fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Build APK
        run: |
          cd musicapp
          npx expo prebuild --platform android
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a; then
            echo "Build failed, trying again without the song details library"
            cd ..
            npm uninstall @missingcore/react-native-metadata-retriever
            rm -rf android
            npx expo prebuild --platform android
            printf '\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          fi

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: musicapp/android/app/build/outputs/apk/release/app-release.apk
